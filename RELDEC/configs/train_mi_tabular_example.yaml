# Example training config for MI tabular RELDEC

experiment:
  code: ab
  matrix_csv: null  # Will be auto-loaded from code preset

training:
  policy_type: mi_tabular_z2
  snr_db: [0.5, 1.0, 1.5, 2.0]
  episodes_per_snr: 2500

hyperparams:
  alpha: 0.1
  beta: 0.9
  epsilon: 0.6
  l_max: 50

parameters:
  z: 2
  mi_bins: 21

checkpoint:
  every_episodes: 100
  no_history: false

system:
  device: cpu
  seed: 42
