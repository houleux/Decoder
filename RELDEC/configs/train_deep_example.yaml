# Example training config for Deep RELDEC with DQN

experiment:
  code: ab
  matrix_csv: null  # Will be auto-loaded from code preset

training:
  policy_type: deep_z2
  snr_db: [0.5, 1.0, 1.5, 2.0]
  episodes_per_snr: 2500

hyperparams:
  alpha: 0.0  # Not used for deep training
  beta: 0.9
  epsilon: 0.6  # Still used as discount factor
  l_max: 50

parameters:
  z: 2
  mi_bins: 21

dqn:
  learning_rate: 1e-4
  hidden_layer_size: 256
  experience_replay_size: 100000
  target_update_freq: 1000

checkpoint:
  every_episodes: 100
  no_history: false

system:
  device: cuda
  seed: 42
