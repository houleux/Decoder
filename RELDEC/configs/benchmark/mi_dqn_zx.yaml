# Phase 6: Normalized Benchmark - MI DQN ZX
# Budget: 15k episodes (2,500 per SNR)
# Family: mi_dqn
# Method: mi_dqn_zx

experiment:
  name: "phase6_benchmark_mi_dqn_zx"
  code: ab  # Will be overridden per matrix
  matrix_csv: null

training:
  policy_type: mi_dqn_zx
  snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  episodes_per_snr: 2500

hyperparams:
  alpha: 0.0        # Not used for deep training
  beta: 0.9         # Discount factor
  epsilon: 0.6      # Epsilon-greedy exploration
  l_max: 50         # Max iterations

parameters:
  z: 6
  mi_bins: 21

dqn:
  learning_rate: 1e-4
  hidden_layer_size: 256
  experience_replay_size: 100000
  target_update_freq: 1000
  batch_size: 32

checkpoint:
  every_episodes: 100
  no_history: false

system:
  device: cuda
  seed: 42
  budget_episodes: 15000
  budget_description: "15k total episodes (2.5k per SNR)"
