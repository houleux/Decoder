# Phase 6: Normalized Benchmark - Tabular RELDEC
# Budget: 15k episodes (2,500 per SNR)
# Family: tabular
# Method: reldec

experiment:
  name: "phase6_benchmark_tabular_reldec"
  code: ab  # Will be overridden per matrix
  matrix_csv: null

training:
  policy_type: tabular
  snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  episodes_per_snr: 2500

hyperparams:
  alpha: 0.1        # Learning rate
  beta: 0.9         # Discount factor
  epsilon: 0.6      # Exploration rate
  l_max: 50         # Max iterations

parameters:
  z: 1
  mi_bins: 21

checkpoint:
  every_episodes: 100
  no_history: false

system:
  device: cpu
  seed: 42
  budget_episodes: 15000
  budget_description: "15k total episodes (2.5k per SNR)"
