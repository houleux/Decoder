# Phase 6: Normalized Benchmark - MI Tabular Z2
# Budget: 100k episodes (16,667 per SNR)
# Family: mi_tabular
# Method: mi_tabular_z2

experiment:
  name: "phase6_benchmark_mi_tabular_z2"
  code: ab  # Will be overridden per matrix
  matrix_csv: null

training:
  policy_type: mi_tabular_z2
  snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  episodes_per_snr: 16667

hyperparams:
  alpha: 0.1        # Learning rate
  beta: 0.9         # Discount factor
  epsilon: 0.6      # Exploration rate
  l_max: 50         # Max iterations

parameters:
  z: 2
  mi_bins: 21

checkpoint:
  every_episodes: 100
  no_history: false

system:
  device: cpu
  seed: 42
  budget_episodes: 100000
  budget_description: "100k total episodes (16.7k per SNR)"
