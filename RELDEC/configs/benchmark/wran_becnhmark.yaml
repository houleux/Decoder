benchmark:
  name: wran_benchmark
  description: new wran-only benchmark with 2,500 episodes per SNR for 04-06-2025.

experiment:
  code: wran
  matrix_csv: null

benchmarking:
  matrices:
    - wran
  methods:
    - flooding
    - random
    - round_robin
    - reldec
    - deep_reldec_zx
    - mi_naive_zx
    - mi_dqn_zx
    - mi_tabular_zx
    - augmented_max_avg_zx
    - augmented_max_zx
    - augmented_average_zx
  train:
    tabular:
      episodes_per_snr: 2500
      max_episodes: null
      checkpoint_every_episodes: 2500
      no_history: false
    deep:
      episodes_per_snr: 2500
      max_episodes: null
      checkpoint_every_episodes: 2500
      no_history: false
  evaluation:
    snr_db: [0.5, 1.0, 1.5, 2.0, 2.5]
    i_max: 5
    target_frame_errors: 100
    max_frames: 100000

parameters:
  z: 1
  mi_bins: 4

checkpoints:
  q_table: null
  mi_tabular_q_table: null
  deep_checkpoint: null

system:
  seed: 42
  random_codewords: false
  cpu_workers: 40
  gpu_workers: 4
  device_policy: pinned