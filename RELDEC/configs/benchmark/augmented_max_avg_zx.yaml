# Phase 6: Normalized Benchmark - Augmented Max+Avg ZX
# Budget: 400k episodes (66,667 per SNR)
# Family: augmented
# Method: augmented_max_avg_zx

experiment:
  name: "phase6_benchmark_augmented_max_avg_zx"
  code: ab  # Will be overridden per matrix
  matrix_csv: null

training:
  policy_type: augmented_max_avg_zx
  snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  episodes_per_snr: 66667

hyperparams:
  alpha: 0.0        # Not used for deep training
  beta: 0.9         # Discount factor
  epsilon: 0.6      # Epsilon-greedy exploration
  l_max: 50         # Max iterations

parameters:
  z: dynamic
  mi_bins: 21
  mode: max_avg

dqn:
  learning_rate: 1e-4
  hidden_layer_size: 256
  experience_replay_size: 100000
  target_update_freq: 1000
  batch_size: 32

checkpoint:
  every_episodes: 100
  no_history: false

system:
  device: cuda
  seed: 42
  budget_episodes: 400000
  budget_description: "400k total episodes (66.7k per SNR)"
