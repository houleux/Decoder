# Phase 6: Normalized Benchmark - Baseline Methods
# Budget: None (deterministic, no training)
# Methods: flooding, random, round_robin

# These methods require no training
# Just run evaluation on the test matrices

flooding:
  experiment:
    name: "phase6_benchmark_baseline_flooding"
    method: flooding
  
  evaluation:
    snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
    num_samples: 10000
    max_iterations: 50
    save_detailed: true
    save_ber_by_iteration: true

  system:
    device: cpu
    seed: 42

random:
  experiment:
    name: "phase6_benchmark_baseline_random"
    method: random
  
  evaluation:
    snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
    num_samples: 10000
    max_iterations: 50
    save_detailed: true
    save_ber_by_iteration: true

  system:
    device: cpu
    seed: 42

round_robin:
  experiment:
    name: "phase6_benchmark_baseline_round_robin"
    method: round_robin
  
  evaluation:
    snr_db: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
    num_samples: 10000
    max_iterations: 50
    save_detailed: true
    save_ber_by_iteration: true

  system:
    device: cpu
    seed: 42
