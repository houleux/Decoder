# PPO Hyperparameters for LDPC Environments

# Full LLR observation (high-dimensional)
gymnasium_env_2/LDPC-FullLLR-v0:
  n_timesteps: !!float 2e5
  policy: 'MlpPolicy'
  n_steps: 2048
  batch_size: 64
  gae_lambda: 0.95
  gamma: 0.99
  n_epochs: 10
  ent_coef: 0.01
  learning_rate: !!float 3e-4
  clip_range: 0.2
  policy_kwargs: "dict(net_arch=[dict(pi=[128, 128], vf=[128, 128])])"

# LLR Statistics (low-dimensional, faster training)
gymnasium_env_2/LDPC-LLRStats-v0:
  n_timesteps: !!float 1e5
  policy: 'MlpPolicy'
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.95
  gamma: 0.99
  n_epochs: 10
  ent_coef: 0.01
  learning_rate: !!float 3e-4
  clip_range: 0.2
  policy_kwargs: "dict(net_arch=[dict(pi=[64, 64], vf=[64, 64])])"

