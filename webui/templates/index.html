<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Action Bar -->
        <header class="action-bar">
            <div class="action-bar-left">
                <h1>Experiments Database</h1>
                <button id="launch-experiment-btn" class="btn-primary" style="margin-left: 20px;">Launch New Experiment</button>
            </div>
            <button id="plot-selected-btn" class="btn-primary" disabled>Plot Selected (0)</button>
        </header>

        <main class="main-content">
            <!-- Charts Section (hidden by default) -->
            <section id="charts-section" class="hidden">
                <div class="charts-header">
                    <h2>Comparison Plots</h2>
                    <div>
                        <a id="download-plot-btn" class="btn-primary" style="margin-right: 12px; text-decoration: none;" download="plot.png">Download Plot</a>
                        <button id="close-charts-btn" class="btn-secondary">Close Plots</button>
                    </div>
                </div>
                <div class="matplotlib-container">
                    <img id="matplotlib-output" src="" alt="Matplotlib Evaluation Plot" />
                </div>
            </section>

            <!-- Search & Filters -->
            <section class="search-section">
                <div class="search-container">
                    <input type="text" id="search-filter" class="search-bar-main" placeholder="Search experiments...">
                    <button id="toggle-filters-btn" class="btn-secondary">Show Filters</button>
                </div>
                
                <div id="filters-panel" class="filters-panel hidden">
                    <div class="filters-header">
                        <h3>Dynamic Parameters</h3>
                        <button id="reset-filters-btn" class="btn-link">Reset</button>
                    </div>
                    <div id="dynamic-filters-container" class="dynamic-filters-grid">
                        <!-- Filters injected via JS -->
                    </div>
                </div>
            </section>

            <!-- Experiments List -->
            <section class="experiments-section">
                <table class="experiments-table">
                    <thead>
                        <tr>
                            <th class="col-check"><input type="checkbox" id="select-all"></th>
                            <th>Matrix</th>
                            <th>Method</th>
                            <th>Z</th>
                            <th>Eps</th>
                            <th>Eval Frames</th>
                            <th>Config ID</th>
                            <th class="col-action">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="experiments-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    
    <!-- Launch Experiment Modal -->
    <div id="launch-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>Launch New Experiment</h2>
                <button id="close-modal-btn" class="btn-link">&times;</button>
            </div>
            <form id="launch-form">
                <div class="form-group">
                    <label for="matrix-select">Matrix</label>
                    <select id="matrix-select" name="matrix" required>
                        <!-- Options populated via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Methods</label>
                    <div class="checkbox-group" id="methods-checkboxes">
                        <!-- Options populated via JS -->
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="z-vals">Cluster Size (Z)</label>
                        <input type="text" id="z-vals" name="zVals" placeholder="e.g. 1 2 4" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="l-max">L Max</label>
                        <input type="number" id="l-max" name="lMax" placeholder="e.g. 10" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label for="train-snrs">Train SNRs (space separated)</label>
                    <input type="text" id="train-snrs" name="trainSnrs" placeholder="e.g. 1.0 1.5 2.0" value="1.0 1.5 2.0 2.5 3.0" required>
                </div>
                <div class="form-group">
                    <label for="eval-snrs">Eval SNRs (space separated)</label>
                    <input type="text" id="eval-snrs" name="evalSnrs" placeholder="e.g. 1.0 2.0 3.0" value="1.0 2.0 3.0" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="train-episodes">Train Episodes</label>
                        <input type="number" id="train-episodes" name="trainEpisodes" value="100" required>
                    </div>
                    <div class="form-group">
                        <label for="max-frames">Max Frames</label>
                        <input type="number" id="max-frames" name="maxFrames" value="1000" required>
                    </div>
                    <div class="form-group">
                        <label for="workers">Workers</label>
                        <input type="number" id="workers" name="workers" value="40" required>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 16px;">
                    <label>Terminal Command</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="launch-cmd-preview" readonly style="flex: 1; font-family: monospace; font-size: 0.8rem; background: #000;">
                        <button type="button" id="copy-launch-cmd-btn" class="btn-secondary">Copy</button>
                    </div>
                </div>

                <div class="modal-footer">
                    <span id="launch-status" class="status-message"></span>
                    <button type="submit" id="submit-launch-btn" class="btn-primary">Launch</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Extend Eval Modal -->
    <div id="extend-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel" style="max-width: 700px;">
            <div class="modal-header">
                <h2>Extend Evaluation</h2>
                <button id="close-extend-btn" class="btn-link">&times;</button>
            </div>
            
            <div style="margin-bottom: 24px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">TARGET CONFIGURATION (READ-ONLY)</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.9rem;">
                    <div><strong style="color: var(--text-primary)">Matrix:</strong> <span id="ext-matrix"></span></div>
                    <div><strong style="color: var(--text-primary)">Method:</strong> <span id="ext-method"></span></div>
                    <div><strong style="color: var(--text-primary)">Z-Val:</strong> <span id="ext-z"></span></div>
                    <div><strong style="color: var(--text-primary)">Seed:</strong> <span id="ext-seed"></span></div>
                    <div><strong style="color: var(--text-primary)">L Max:</strong> <span id="ext-lmax"></span></div>
                    <div><strong style="color: var(--text-primary)">Train Episodes:</strong> <span id="ext-train-eps"></span></div>
                </div>
            </div>

            <form id="extend-form">
                <input type="hidden" id="ext-matrix-val" name="matrix">
                <input type="hidden" id="ext-method-val" name="methods">
                <input type="hidden" id="ext-z-val" name="zVals">
                <input type="hidden" id="ext-seed-val" name="seed">
                <input type="hidden" id="ext-lmax-val" name="lMax">
                <input type="hidden" id="ext-train-eps-val" name="trainEpisodes">
                
                <div class="form-group">
                    <label for="ext-eval-snrs">Eval SNRs (space separated)</label>
                    <input type="text" id="ext-eval-snrs" name="evalSnrs" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ext-max-frames">New Max Frames</label>
                        <input type="number" id="ext-max-frames" name="maxFrames" required>
                    </div>
                    <div class="form-group">
                        <label for="ext-tfe">Target Frame Errors</label>
                        <input type="number" id="ext-tfe" name="targetFrameErrors" value="100000" required>
                    </div>
                    <div class="form-group">
                        <label for="ext-workers">Workers</label>
                        <input type="number" id="ext-workers" name="workers" value="40" required>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 16px;">
                    <label>Terminal Command</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="ext-cmd-preview" readonly style="flex: 1; font-family: monospace; font-size: 0.8rem; background: #000;">
                        <button type="button" id="copy-cmd-btn" class="btn-secondary">Copy</button>
                    </div>
                </div>

                <div class="modal-footer">
                    <span id="extend-status" class="status-message"></span>
                    <button type="submit" id="submit-extend-btn" class="btn-primary">Run in Background</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
